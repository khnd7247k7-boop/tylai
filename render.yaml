services:
  - type: web
    name: tylai-gemini-proxy
    runtime: node
    rootDir: gemini-proxy
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: tyl-ai-coach
      - key: GEMINI_KEY
        sync: false
      - key: USDA_FDC_API_KEY
        sync: false
      - key: NUTRITIONIX_APP_ID
        sync: false
      - key: NUTRITIONIX_API_KEY
        sync: false
