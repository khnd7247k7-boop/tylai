<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TYL</title>
    <meta name="description" content="TYL — training and lifestyle." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #4ade80;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 2rem 1.25rem 4rem;
        line-height: 1.5;
      }
      header {
        text-align: center;
        max-width: 40rem;
        margin-bottom: 2rem;
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
      }
      p.lead {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }
      .gallery {
        width: 100%;
        max-width: 960px;
        display: grid;
        gap: 1.25rem;
        grid-template-columns: 1fr;
      }
      @media (min-width: 640px) {
        .gallery {
          grid-template-columns: 1fr 1fr;
        }
      }
      figure {
        margin: 0;
        border-radius: 12px;
        overflow: hidden;
        background: #18181b;
        border: 1px solid #27272a;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: middle;
      }
      footer {
        margin-top: 3rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.875rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>TYL</h1>
      <p class="lead">Apparel &amp; movement — static preview for web hosting.</p>
    </header>
    <div class="gallery">
      <figure>
        <img src="./tyl-apparel-01.png" alt="TYL apparel 1" loading="eager" />
      </figure>
      <figure>
        <img src="./tyl-apparel-02.png" alt="TYL apparel 2" loading="lazy" />
      </figure>
    </div>
    <footer>
      Replace this block with store links, email capture, or your main marketing site when ready.
    </footer>
  </body>
</html>
